<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#7DF9FF"/>
      <stop offset="35%" stop-color="#00D4FF"/>
      <stop offset="70%" stop-color="#0077AA"/>
      <stop offset="100%" stop-color="#001822"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#00D4FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEBFF"/>
      <stop offset="50%" stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#004466"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- background circle -->
  <circle cx="256" cy="256" r="256" fill="#00060a"/>

  <!-- outer glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- outer thin ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#0d3347" stroke-width="3"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#ring)" stroke-width="2.5" opacity="0.9"/>

  <!-- segmented arc reactor rings -->
  <g fill="none" stroke="#00D4FF" stroke-linecap="round">
    <circle cx="256" cy="256" r="165" stroke-width="6" stroke-dasharray="40 18" opacity="0.85"/>
    <circle cx="256" cy="256" r="140" stroke-width="3" stroke-dasharray="18 12" opacity="0.55"/>
    <circle cx="256" cy="256" r="118" stroke-width="8" stroke-dasharray="28 14" opacity="0.75"/>
  </g>

  <!-- inner core -->
  <circle cx="256" cy="256" r="72" fill="url(#core)"/>
  <circle cx="256" cy="256" r="72" fill="none" stroke="#7DF9FF" stroke-width="2" opacity="0.7"/>
  <circle cx="256" cy="256" r="48" fill="#001018" opacity="0.35"/>
  <circle cx="256" cy="256" r="28" fill="#E8FFFF" opacity="0.9"/>
  <circle cx="256" cy="242" r="10" fill="#FFFFFF" opacity="0.55"/>

  <!-- small ticks -->
  <g stroke="#00D4FF" stroke-width="2" opacity="0.5">
    <line x1="256" y1="62" x2="256" y2="82"/>
    <line x1="256" y1="430" x2="256" y2="450"/>
    <line x1="62" y1="256" x2="82" y2="256"/>
    <line x1="430" y1="256" x2="450" y2="256"/>
  </g>
</svg>
